# Production shape: Postgres, the app, and Caddy terminating TLS in front of it.
# `SITE_ADDRESS` is the public hostname Caddy gets a certificate for.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Small, and bounded: the database is the one thing on this box that must
    # not be paged out while something else misbehaves.
    mem_limit: 420m
    shm_size: "128mb"
    environment:
      POSTGRES_USER: sidestage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidestage}
      POSTGRES_DB: sidestage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidestage"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        # Written into /app/build.json at image build; the deploy script supplies
        # both from the local git HEAD. A container whose stamp does not match
        # HEAD is a deploy that did not take, which is what this exists to catch.
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-}
    restart: unless-stopped
    # PID 1 that REAPS. The app launches a real Chrome every discovery refresh,
    # and Node as PID 1 does not wait() on orphaned grandchildren: measured on
    # 2026-09-18, four defunct `[chrome]` / `[chrome_crashpad]` entries survived
    # every five-minute poll. Zombies hold no memory, but they are the visible
    # end of a browser that was not fully torn down, and the same box wedged
    # after ~20 hours of that. tini reaps them.
    init: true
    # A ceiling, so a leak in the browser path can never again starve Postgres,
    # Caddy and sshd on a 2 GB box — which is what "the site is down" looked
    # like on 2026-09-18: TCP accepted on every port, nothing ever answering,
    # 3.2M disk reads per three hours of pure page-thrash. Over this, the app
    # is OOM-killed and restarted by `restart: unless-stopped`; under it,
    # everything else keeps serving.
    mem_limit: 1100m
    memswap_limit: 1100m
    # Docker's default is TEN SECONDS, and the shutdown chain is: drain the
    # reply pipeline (each in-flight gateway call up to 6s) and THEN close
    # every browser. On a 2 vCPU box that can exceed ten seconds, at which
    # point SIGKILL leaves exactly the orphaned Chrome processes `init: true`
    # above exists to reap. Reaping them is containment, not a reason to keep
    # making them.
    stop_grace_period: 45s
    env_file: .env
    environment:
      DATABASE_URL: postgres://sidestage:${POSTGRES_PASSWORD:-sidestage}@db:5432/sidestage
      PORT: "8790"
      # The seller's eBay Live profile and every show's kept media live here.
      EBAY_PROFILE_DIR: /app/data/ebay-profile
      EBAY_SESSION_PATH: /app/data/ebay-session.json
      SHOW_MEDIA_DIR: /app/data/shows
      # Registered with eBay verbatim; part of the deletion-challenge hash.
      EBAY_DELETION_ENDPOINT: https://${SITE_ADDRESS}/api/ebay/account-deletion
      # EBAY_DISCOVERY_PROXY (the fixed-IP egress for the eBay Live discovery
      # browser, see ingest/ebaylive/session.ts) comes from .env like the rest
      # of the eBay settings, so the sign-in on a laptop and the reads on the
      # server share one address — the whole point of it.
    # Lets a proxy or tunnel running on the host be reached as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      # Catalogs are files the app writes (imports, prepared shows); keep them on the host.
      - ./fixtures/catalogs:/app/fixtures/catalogs
    depends_on:
      db:
        condition: service_healthy
    # Chrome needs more than Docker's 64 MB default, but /dev/shm is tmpfs and
    # its pages count against mem_limit above — a 1 GB shm under a 1.1 GB limit
    # is a way to OOM the container by filling a filesystem. Half that, and the
    # browsers pass --disable-dev-shm-usage anyway (session.ts, watcher.ts).
    shm_size: "512mb"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      # The DIRECTORY, not the file. Docker binds a single-file mount by inode,
      # and rsync replaces a file by writing a temporary one and renaming it —
      # so a deploy that changed the Caddyfile left this container reading the
      # inode it started with. Measured 2026-09-28: the header block below
      # shipped, the deploy reported success, `caddy reload` re-read the same
      # stale file and reported success too, and `curl -D -` came back with none
      # of it. Mounting the directory makes the path resolve fresh on every read,
      # which is what lets the hot reload in scripts/deploy-aws.sh work at all.
      # Caddy's default config path is /etc/caddy/Caddyfile, so nothing else
      # changes.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
