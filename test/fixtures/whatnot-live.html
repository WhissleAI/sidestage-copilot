<!--
  A Whatnot live room, trimmed to the shape src/surfaces/whatnot/scrape.ts
  reads. Hand-reduced, not a capture of a real room: Whatnot sits behind a
  Cloudflare managed challenge (a plain GET returns 403 "Just a moment...",
  measured 2026-09-18), so a capture cannot be refreshed on demand, and a real
  capture would mean committing a real seller's chat.

  Two markups on purpose. The first three messages carry `data-testid`, which
  is what the current app ships; the fourth uses the hashed CSS-module shape
  the app still falls back to on narrow viewports. Both are in the selector's
  comma list, and this fixture is what proves the list is doing its job.
-->
