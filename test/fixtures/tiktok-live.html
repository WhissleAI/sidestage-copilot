<!--
  A TikTok Live room, trimmed to the shape src/surfaces/tiktoklive/scrape.ts
  reads. Hand-reduced for the same reasons as the Whatnot fixture, plus one
  more: this surface is OFF by default (TIKTOK_LIVE_ENABLED), so there is no
  routine run against a live room that would keep a capture current.

  The thing this fixture is really here to pin down is the rows with no id.
  TikTok keys its chat list in React and the key does not reach the DOM, so two
  of the rows below carry `data-id` and two carry nothing — which is exactly
  the case `dedupeKey` falls back on, and exactly the case where a viewer who
  repeats themselves is heard once. The last two rows are that repeat.
-->
